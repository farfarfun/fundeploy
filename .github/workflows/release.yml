name: release

on:
  push:
    tags:
      - "v[0-9]*"

# 顶层默认最小权限；确实需要写权限的 job 各自单独声明。
permissions:
  contents: read

# 按 tag 分组：重推同一个 tag 时不该有两次发布同时在跑。不取消进行中的那次，
# 它可能已经把一半附件传上去了。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 版本号核对
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # 二进制自报的版本来自 CARGO_PKG_VERSION。它和 tag 对不上的话，装出来的
      # fundeploy 会说自己是另一个版本，`upgrade` 从此每次都认为有新版可升。
      - id: v
        run: |
          set -eu
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 和 Cargo.toml 里的 ${version} 对不上" >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: 装 musl 工具链
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: 装工具链
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        run: |
          set -eu
          mkdir -p dist
          tar -czf "dist/fundeploy-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" fundeploy

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  release:
    name: 发布
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: 打 .deb
        run: |
          set -eu
          sudo apt-get update -y && sudo apt-get install -y dpkg-dev
          work="$(mktemp -d)"
          for pair in "x86_64-unknown-linux-musl amd64" "aarch64-unknown-linux-musl arm64"; do
            set -- $pair
            mkdir -p "${work}/$2"
            tar -xzf "dist/fundeploy-$1.tar.gz" -C "${work}/$2"
            bash packaging/build-deb.sh "${work}/$2/fundeploy" "${{ needs.check.outputs.version }}" "$2" dist
          done

      # 校验和清单最后生成：它要覆盖上面所有的附件，提前算就漏掉 .deb。
      - name: 生成 SHA256SUMS
        working-directory: dist
        # 必须是块标量：单行 run 是 YAML 的普通标量，空格后的 # 会被当成注释，
        # 命令被从那里截断——sed 的分隔符刚好是 #，于是整行只剩半个引号。
        #
        # 用 ./* 而不是 *：文件名以 - 开头时后者会被 sha256sum 当成选项。多出来
        # 的 ./ 前缀要去掉，install.sh 和 Homebrew formula 都是按裸文件名查的。
        run: |
          sha256sum ./* | sed 's|\./||' >SHA256SUMS
          cat SHA256SUMS

      - name: 发 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

  verify-install:
    name: 装机验证 (${{ matrix.os }})
    needs: [check, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # install.sh 是别人碰到这个项目的第一条命令，而它只有在真有一个发布好的
      # release 时才跑得通——所以验证只能放在发布之后。这一步失败说明刚发出去
      # 的那一版装不上，得立刻补一个。
      - name: 照装机脚本装一遍
        run: sh install.sh --version "${{ needs.check.outputs.version }}"

      - name: 装出来的是不是这一版
        # upgrade --check 要问 GitHub API。匿名限流按出口 IP 算，而 runner 的
        # 出口是共用的，不带 token 的话这一步会随别人的用量偶发红。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          got="$("$HOME/.local/bin/fundeploy" --version)"
          echo "$got"
          case "$got" in
            *"${{ needs.check.outputs.version }}"*) ;;
            *)
              echo "装出来的版本不对" >&2
              exit 1
              ;;
          esac
          "$HOME/.local/bin/fundeploy" list >/dev/null
          "$HOME/.local/bin/fundeploy" upgrade --check

  # apt 源和 Homebrew formula 都不在这个仓库里生成了：它们按 farfarfun/packages
  # 的清单重建，那边一次管全组织的包。这儿只负责把附件挂上 Release，然后吱一声。
  notify-packages:
    name: 通知包仓库重建
    needs: verify-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 打一个 repository_dispatch
        env:
          # 跨仓库触发用不了默认的 GITHUB_TOKEN，得是一个对 farfarfun/packages
          # 有写权限的 PAT。
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::没配 PACKAGES_DISPATCH_TOKEN，跳过。包仓库每天会兜底扫一遍。"
            exit 0
          fi
          gh api repos/farfarfun/packages/dispatches \
            -f event_type=package-published \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"

  publish-crate:
    name: 发到 crates.io
    needs: [check, verify-install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal --no-self-update

      # 排在装机验证后面：crates.io 上的版本撤不回来。yank 只是不让新依赖解析到
      # 它，那个 .crate 本身永远在上面，所以等二进制那条路先验过再发。
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::没配 CARGO_REGISTRY_TOKEN，跳过 crates.io 发布。"
            exit 0
          fi
          # 同一个 tag 重跑时这一版已经在上面了，再 publish 是一个硬错误。先问
          # 一句，不让重跑整条流水线卡在最后一步。
          if curl -fsS -A fundeploy-release \
            "https://crates.io/api/v1/crates/fundeploy/${VERSION}" >/dev/null; then
            echo "${VERSION} 已经发过了，跳过。"
            exit 0
          fi
          cargo publish --locked

