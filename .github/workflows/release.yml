name: release

on:
  push:
    tags:
      - "v[0-9]*"

# 顶层默认最小权限；确实需要写权限的 job 各自单独声明。
permissions:
  contents: read

# 连续推两个 tag 时，Pages 部署与 tap 推送会互相竞争。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 版本号核对
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # 二进制自报的版本来自 CARGO_PKG_VERSION。它和 tag 对不上的话，装出来的
      # fundeploy 会说自己是另一个版本，`upgrade` 从此每次都认为有新版可升。
      - id: v
        run: |
          set -eu
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 和 Cargo.toml 里的 ${version} 对不上" >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: 装 musl 工具链
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: 装工具链
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        run: |
          set -eu
          mkdir -p dist
          tar -czf "dist/fundeploy-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" fundeploy

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  release:
    name: 发布
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: 打 .deb
        run: |
          set -eu
          sudo apt-get update -y && sudo apt-get install -y dpkg-dev
          work="$(mktemp -d)"
          for pair in "x86_64-unknown-linux-musl amd64" "aarch64-unknown-linux-musl arm64"; do
            set -- $pair
            mkdir -p "${work}/$2"
            tar -xzf "dist/fundeploy-$1.tar.gz" -C "${work}/$2"
            bash packaging/build-deb.sh "${work}/$2/fundeploy" "${{ needs.check.outputs.version }}" "$2" dist
          done

      # 校验和清单最后生成：它要覆盖上面所有的附件，提前算就漏掉 .deb。
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: sha256sum ./* | sed 's# \./# #' >SHA256SUMS

      - name: 生成 Homebrew formula
        env:
          FUNDEPLOY_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash packaging/render-homebrew-formula.sh \
            "${{ needs.check.outputs.version }}" dist/SHA256SUMS dist/fundeploy.rb

      - name: 发 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 7

  verify-install:
    name: 装机验证 (${{ matrix.os }})
    needs: [check, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # install.sh 是别人碰到这个项目的第一条命令，而它只有在真有一个发布好的
      # release 时才跑得通——所以验证只能放在发布之后。这一步失败说明刚发出去
      # 的那一版装不上，得立刻补一个。
      - name: 照装机脚本装一遍
        run: sh install.sh --version "${{ needs.check.outputs.version }}"

      - name: 装出来的是不是这一版
        run: |
          set -eu
          got="$("$HOME/.local/bin/fundeploy" --version)"
          echo "$got"
          case "$got" in
            *"${{ needs.check.outputs.version }}"*) ;;
            *)
              echo "装出来的版本不对" >&2
              exit 1
              ;;
          esac
          "$HOME/.local/bin/fundeploy" list >/dev/null
          "$HOME/.local/bin/fundeploy" upgrade --check

  apt-repository:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      configured: ${{ steps.config.outputs.apt }}
    steps:
      - uses: actions/checkout@v4

      - id: config
        name: Check APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$APT_GPG_PRIVATE_KEY" ]]; then
            echo "apt=true" >>"$GITHUB_OUTPUT"
          else
            echo "apt=false" >>"$GITHUB_OUTPUT"
            echo "APT_GPG_PRIVATE_KEY is not configured; skipping APT Pages publication."
          fi

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.apt == 'true'
        with:
          name: release-assets
          path: dist

      - name: Install APT repository tools
        if: steps.config.outputs.apt == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev

      - id: signing-key
        name: Import APT signing key
        if: steps.config.outputs.apt == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          fingerprint="$(printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --with-colons --import-options show-only --import 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ -n "$fingerprint" ]]
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fingerprint=$fingerprint" >>"$GITHUB_OUTPUT"

      - name: Build signed APT repository
        if: steps.config.outputs.apt == 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          bash packaging/build-apt-repo.sh dist public "${{ steps.signing-key.outputs.fingerprint }}"

      - uses: actions/upload-pages-artifact@v3
        if: steps.config.outputs.apt == 'true'
        with:
          path: public

  deploy-apt-pages:
    needs: apt-repository
    if: needs.apt-repository.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: config
        name: Check Homebrew Tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -n "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            echo "tap=true" >>"$GITHUB_OUTPUT"
          else
            echo "tap=false" >>"$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_DEPLOY_KEY is not configured; skipping Tap update."
          fi

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.tap == 'true'
        with:
          name: release-assets
          path: dist

      - uses: actions/checkout@v4
        if: steps.config.outputs.tap == 'true'
        with:
          repository: farfarfun/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Formula
        if: steps.config.outputs.tap == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp ../dist/fundeploy.rb Formula/fundeploy.rb
          git add Formula/fundeploy.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update fundeploy to ${GITHUB_REF_NAME}"
          git push
