name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# 最小权限：本工作流只读代码。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-lint-

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS 必须覆盖：平台差异（brew cask 只在 macOS 上有、.zprofile 而不是
        # .profile、dmg 而不是 AppImage）是这个项目里真实存在的分支。
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - run: cargo test

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      # 发布构建放进 CI，而不是只在 tag 上跑。musl 静态链接这条路有它自己的
      # 失败方式（ring 要 C 编译器、交叉链接器找不到），只在打 tag 时才发现
      # 就意味着每修一次都要重打一个 tag。
      - name: 装 musl 工具链
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: 装工具链
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.target }}-

      - run: cargo build --release --target ${{ matrix.target }}

      # 跑一下。能编出来不等于能起来——静态链接出岔子时的典型表现就是
      # 「文件在那儿，一执行就报 Exec format error」。
      - name: 跑一下本机那份
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/fundeploy --version

      - name: 确认是静态链接的
        if: runner.os == 'Linux'
        run: |
          set -eu
          bin=./target/${{ matrix.target }}/release/fundeploy
          if ldd "$bin" 2>&1 | grep -qv 'not a dynamic executable\|statically linked'; then
            echo "还带着动态依赖："
            ldd "$bin"
            exit 1
          fi

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 剩下的 shell 只有装机脚本和打包脚本，但装机脚本是别人碰到这个项目的
      # 第一条命令，它坏了的代价比别处都大。
      - name: 检查剩下的 shell 脚本
        run: |
          set -uo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          echo "检查 ${#files[@]} 个文件"
          shellcheck --severity=warning --format=gcc "${files[@]}"
